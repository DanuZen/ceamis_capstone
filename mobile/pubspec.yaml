name: ceamis_mobile
description: "CEAMIS Mobile - Catatan Income Anak Manis"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  fl_chart: ^0.69.2

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  http: ^1.2.0
  dio: ^5.7.0

  # Auth & Storage
  supabase_flutter: ^2.8.3
  flutter_secure_storage: ^9.2.2

  # OCR & Camera
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.19.0
  go_router: ^14.6.2
  flutter_dotenv: ^5.2.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
